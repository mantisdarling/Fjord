<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Fjord privacy settings</title><style>body{max-width:680px;margin:60px auto;padding:0 24px;background:#e7e6df;color:#171817;font-family:Arial,sans-serif}h1{font-size:52px;letter-spacing:-.08em;margin:0 0 12px}p{color:#777872;line-height:1.5}.meta,label{font:11px monospace;text-transform:uppercase;letter-spacing:.08em}textarea{display:block;width:100%;min-height:100px;margin:14px 0 18px;padding:12px;border:1px solid #aaa;background:#f1f0e9;font:14px monospace}button{background:#c8ff3d;border:0;padding:14px 18px;font:11px monospace;text-transform:uppercase;cursor:pointer}#saved{margin-left:12px;color:#667329}</style></head><body><div class="meta">Fjord / privacy</div><h1>Your boundary.</h1><p>Fjord never records keystrokes, passwords, payment values, screenshots, private browsing, or sensitive domains. Add domains below to keep them out of your local buffer.</p><label for="domains">Excluded domains — one per line</label><textarea id="domains" placeholder="example.com"></textarea><button id="save">Save exclusions</button><span id="saved" role="status"></span><script src="options.js"></script></body></html>
